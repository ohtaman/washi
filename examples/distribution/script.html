<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaSHI production planning</title>
<h1>Production planning</h1>
<p>Maximize 30x + 50y with x + 2y ≤ 40 and 2x + y ≤ 50.</p>
<label><input id="worker" type="checkbox" checked> Solve in a Worker</label>
<button id="solve" disabled>Solve</button>
<pre id="result">Loading WaSHI…</pre>
<script src="./washi/washi.min.js"></script>
<script>
  const { Model, maximize } = Washi;
  const button = document.querySelector("#solve");
  const output = document.querySelector("#result");
  button.disabled = false;
  button.onclick = async () => {
    button.disabled = true;
    output.textContent = "Solving…";
    try {
      const model = new Model("Production");
      const x = model.integer("x", { lb: 0 });
      const y = model.integer("y", { lb: 0 });
      model.objective(maximize(x.mul(30).add(y.mul(50))));
      model.constraint(x.add(y.mul(2)).le(40));
      model.constraint(x.mul(2).add(y).le(50));
      const status = await model.solve({ useWorker: document.querySelector("#worker").checked });
      output.textContent = JSON.stringify({ status, objective: model.objectiveValue, x: x.value, y: y.value }, null, 2);
    } catch (error) {
      output.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  };
  button.click();
</script>
</html>
