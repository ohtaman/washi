<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaSHI GLPK Script Plugin</title>
<h1>GLPK Solver Plugin (&lt;script&gt; IIFE)</h1>
<p>Maximize 10x + 6y + 4z with x + y + z ≤ 100, 10x + 4y + 5z ≤ 600, 2x + 2y + 6z ≤ 300 (Integer MIP).</p>
<button id="solve" disabled>Solve</button>
<pre id="result">Loading washi.min.js & glpk.min.js…</pre>
<script src="./washi/washi.min.js"></script>
<script src="./washi/solvers/glpk.min.js"></script>
<script>
  const button = document.querySelector("#solve");
  const output = document.querySelector("#result");
  button.disabled = false;
  button.onclick = async () => {
    button.disabled = true;
    output.textContent = "Solving with GLPK…";
    try {
      const { Model, maximize } = window.Washi;
      const model = new Model({ name: "GLPK_Script_Knapsack", solver: "glpk" });
      const x = model.integer("x", { lb: 0 });
      const y = model.integer("y", { lb: 0 });
      const z = model.integer("z", { lb: 0 });

      model.objective(maximize(x.mul(10).add(y.mul(6)).add(z.mul(4))));
      model.constraint(x.add(y).add(z).le(100));
      model.constraint(x.mul(10).add(y.mul(4)).add(z.mul(5)).le(600));
      model.constraint(x.mul(2).add(y.mul(2)).add(z.mul(6)).le(300));

      const status = await model.solve();
      output.textContent = JSON.stringify({
        solver: "GLPK",
        status,
        objective: model.objectiveValue,
        x: x.value,
        y: y.value,
        z: z.value,
      }, null, 2);
    } catch (error) {
      output.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  };
  button.click();
</script>
</html>
