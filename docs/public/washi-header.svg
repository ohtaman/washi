<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" fill="none">
  <defs>
    <!-- Facet 1: Crimson Red (Warm / Craft) -->
    <linearGradient id="hRedTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="hRedBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="hRedNeck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Facet 2: Center Origami Transition (Purple / Logic) -->
    <linearGradient id="hBodyLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="hBodyRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Facet 3: Electric Indigo (Cool / Tech & Solver) -->
    <linearGradient id="hIndigoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="hIndigoBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="hIndigoTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <g id="washi-header-group" transform="translate(15, 8)">
    <!-- ==================== LEFT: EMBLEM (ORIGAMI POLYTOPE) ==================== -->
    <g id="emblem-scaled" transform="translate(0, 0) scale(0.62)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.8" stroke-linejoin="round">
      <!-- 1. Left Neck & Head -->
      <polygon points="120,110 75,35 60,50 95,120" fill="url(#hRedNeck)" />
      <polygon points="75,35 60,50 50,42" fill="#E11D48" />

      <!-- 2. Right Tail -->
      <polygon points="120,110 165,35 145,120" fill="url(#hIndigoTail)" />

      <!-- 3. Left Wing -->
      <polygon points="120,110 15,55 95,145" fill="url(#hRedTop)" />
      <polygon points="15,55 95,145 70,170" fill="url(#hRedBottom)" />

      <!-- 4. Right Wing -->
      <polygon points="120,110 225,55 145,145" fill="url(#hIndigoTop)" />
      <polygon points="225,55 145,145 170,170" fill="url(#hIndigoBottom)" />

      <!-- 5. Center Diamond Keel -->
      <polygon points="120,110 95,145 120,195" fill="url(#hBodyLeft)" />
      <polygon points="120,110 145,145 120,195" fill="url(#hBodyRight)" />

      <!-- 6. Mathematical Extreme Nodes -->
      <circle cx="15" cy="55" r="4.5" fill="#FFFFFF" stroke="#E11D48" stroke-width="2" />
      <circle cx="225" cy="55" r="4.5" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" />
      <circle cx="120" cy="195" r="4.5" fill="#FFFFFF" stroke="#9333EA" stroke-width="2" />
      <circle cx="120" cy="110" r="3.5" fill="#FFFFFF" stroke="#C026D3" stroke-width="1.8" />
    </g>

    <!-- ==================== RIGHT: TYPOGRAPHY ==================== -->
    <g transform="translate(170, 96)">
      <!-- Main Brand Text -->
      <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="88" letter-spacing="-2">
        <tspan class="text-was" fill="#0F172A">WaS</tspan><tspan fill="#E11D48">HI</tspan>
      </text>

      <!-- Subtitle Tagline -->
      <text x="6" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14.5" letter-spacing="4" class="text-sub" fill="#64748B">
        ALGEBRAIC MODELER
      </text>
    </g>
  </g>

  <style>
    @media (prefers-color-scheme: dark) {
      .text-was { fill: #FFFFFF !important; }
      .text-sub { fill: #94A3B8 !important; }
    }
  </style>
</svg>
